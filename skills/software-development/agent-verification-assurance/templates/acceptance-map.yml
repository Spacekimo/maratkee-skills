# Use this standalone template when OpenSpec is not the canonical source of
# requirements and scenarios. Keep one map per medium/high-risk change, for example:
# .agent/acceptance/ORD-184.yml
#
# This map owns approved requirements/scenarios. The linked Decision Map records
# evidence and interpretation before the semantic owner approves this map.
mode: standalone
work_item: ORD-184
version: 1
status: draft # draft | approved | superseded
contract_ref: .agent/contracts/ORD-184.json
decision_map_ref: .agent/acceptance/ORD-184-decision.yml

semantic_owner:
  name: orders-product-owner
  approval: pending # pending | approved | revise | clarify | accept_risk
  approved_at: null
  decision_evidence_ref: null

evidence_reviewer:
  name: orders-quality-owner
  approval: pending # pending | approved | request_changes
  reviewed_at: null

requirements:
  - id: R-1
    outcome: >-
      A repeated order request with the same idempotency key does not create
      a second order or a second charge.
    decision_map_requirement_ref: R-1
    source_basis: documented # documented | unwritten; decision evidence lives in the Decision Map
    source_evidence_refs:
      - docs/orders/idempotency.md#repeated-requests@abc123
    risk: duplicate order and duplicate charge

acceptance_examples:
  - id: AT-1
    requirement_refs: [R-1]
    decision_map_requirement_ref: R-1
    given: An accepted order exists for idempotency key K.
    when: The client repeats the same valid create-order request with key K.
    then: The original order is returned and no second charge is created.
    rejects:
      - id: RJ-1
        statement: A second order is created.
        verification_ref: VT-1
        proof_ref: assertion:no_second_order
      - id: RJ-2
        statement: The API reports success but creates a duplicate payment.
        verification_ref: VT-1
        proof_ref: assertion:no_second_charge
    approval: pending # pending | approved | superseded

verification:
  - id: VT-1
    acceptance_example_refs: [AT-1]
    type: integration
    exercised_boundary: create-order API and payment integration
    test: tests/integration/orders/idempotency.spec.ts
    baseline:
      type: gap_demonstrated # gap_demonstrated | new_capability | existing_behavior_change | not_practical
      evidence: The base commit creates a duplicate order on a repeated request.
    candidate_result: pending # pending | passes | fails
    ci_evidence: null

implementation:
  pull_request: null
  base_commit: abc123
  candidate_commit: null

open_questions: []
coverage_exclusions: []
